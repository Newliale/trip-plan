<script>
(function () {
  "use strict";
  var KEY = "trip-plan-passphrase";
  var data = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("unlock"), input = document.getElementById("pass");
  var keep = document.getElementById("keep"), err = document.getElementById("err"), btn = document.getElementById("go");
  function bytes(b64) { var s = atob(b64), out = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
  async function decrypt(pass) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(data.salt), iterations: data.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(data.iv) }, key, bytes(data.ct));
    return new TextDecoder().decode(plain);
  }
  async function attempt(pass, remember) {
    btn.disabled = true;
    btn.textContent = "Opening";
    err.textContent = "";
    var html;
    try { html = await decrypt(pass); }
    catch (e) {
      try { localStorage.removeItem(KEY); } catch (e2) { /* nothing saved */ }
      err.textContent = "That passphrase didn't open the plan. Check it and try again.";
      btn.disabled = false;
      btn.textContent = "Open the plan";
      input.focus();
      input.select();
      return;
    }
    try { if (remember) localStorage.setItem(KEY, pass); else localStorage.removeItem(KEY); } catch (e3) { /* private browsing */ }
    document.open();
    document.write(html);
    document.close();
  }
  if (!window.crypto || !crypto.subtle) {
    err.textContent = "This browser can't unlock the plan. Open the link in Safari or Chrome.";
    btn.disabled = true;
    return;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); if (input.value) attempt(input.value, keep.checked); });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e4) { /* private browsing */ }
  if (saved) attempt(saved, true);
})();
</script>
